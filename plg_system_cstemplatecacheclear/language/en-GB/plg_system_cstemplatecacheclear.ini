PLG_SYSTEM_CSTEMPLATECACHECLEAR="System - Cybersalt Template Cache Clear"
PLG_SYSTEM_CSTEMPLATECACHECLEAR_XML_DESCRIPTION="Empties Joomla's page cache when a site template style is saved or made the default, so visitors see the change on their next page load. Each template style gets a <strong>Clear cache on save</strong> switch on its edit screen."

PLG_SYSTEM_CSTEMPLATECACHECLEAR_HOWITWORKS_LABEL="How it works"
PLG_SYSTEM_CSTEMPLATECACHECLEAR_HOWITWORKS_DESC="When you click Save or Save &amp; Close on a site template style, or make a style the default, this plugin empties Joomla's page cache (the System - Page Cache plugin). Visitors then get the new look on their next page load instead of up to 15 minutes later. Each style has its own <strong>Clear cache on save</strong> switch on the <strong>Cache</strong> tab of its edit screen, and it is on unless you turn it off. A CDN (for example Cloudflare) or another caching extension keeps its own copy: clear that one yourself."
PLG_SYSTEM_CSTEMPLATECACHECLEAR_SHOW_MESSAGE_LABEL="Show a message"
PLG_SYSTEM_CSTEMPLATECACHECLEAR_SHOW_MESSAGE_DESC="After the page cache is emptied, show a short message on the template style screen. Only shown when the System - Page Cache plugin is on."
PLG_SYSTEM_CSTEMPLATECACHECLEAR_INTEGRITY_LABEL="File check"

PLG_SYSTEM_CSTEMPLATECACHECLEAR_FIELDSET_LABEL="Cache"
PLG_SYSTEM_CSTEMPLATECACHECLEAR_FIELDSET_DESC="Joomla's page cache keeps a copy of every page for a while (15 minutes by default). With this switch on, saving this style empties that cache, so visitors see your changes on their next page load. If your site also uses a CDN (for example Cloudflare) or another caching extension, clear that cache as well."
PLG_SYSTEM_CSTEMPLATECACHECLEAR_FIELD_LABEL="Clear cache on save"
PLG_SYSTEM_CSTEMPLATECACHECLEAR_FIELD_DESC="Empty Joomla's page cache when this style is saved (Save or Save &amp; Close) or made the default."

PLG_SYSTEM_CSTEMPLATECACHECLEAR_MSG_CLEARED="Joomla's page cache was emptied, so visitors will see this change on their next page load."
PLG_SYSTEM_CSTEMPLATECACHECLEAR_MSG_FAILED="The style was saved, but Joomla's page cache could not be emptied. Clear it in System, then Clear Cache."

